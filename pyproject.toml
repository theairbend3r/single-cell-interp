[project]
name = "drug-perturb-cell"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshaj Verma", email = "akshajverma7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gseapy>=1.3.2",
    "lxml>=6.1.3",
    "pertpy>=1.5.2",
    "polars>=2.2.0",
    "pytorch-ignite>=0.5.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.26.0",
    "nbformat>=5.11.1",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]
